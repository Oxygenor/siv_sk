name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages (clean URLs)
        run: cp dist/index.html dist/404.html

      - name: Prerender static routes as real folders (avoids serving them via 404 fallback)
        run: |
          for route in pro-gimnaziyu novyny uchnyam batkam dokumenty biblioteka formy-navchannya fotogalereya korysni-posylannya kontakty poshuk rozdily; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
